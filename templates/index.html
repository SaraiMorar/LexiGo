<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiGo · 英语词组背诵</title>
  <script>
    // 页面渲染前确定主题，避免闪烁：优先手动选择，否则跟随系统
    (function () {
      var t = localStorage.getItem("theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="{{ static_v('style.css') }}" />
</head>
<body>
  <nav class="topnav">
    <div class="brand">LexiGo</div>
    <div class="nav-links">
      <button class="nav-link active" data-view="home">今日</button>
      <button class="nav-link" data-view="library">词库</button>
      <button class="nav-link" data-view="dashboard">统计</button>
      <button class="nav-link" data-view="cram">突击</button>
    </div>
    <button id="theme-toggle" class="theme-toggle" title="切换浅色/深色" aria-label="切换主题">
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" />
      </svg>
    </button>
  </nav>

  <main class="container">

    <!-- 首页 -->
    <section id="view-home" class="view">
      <header class="home-header">
        <h1>LexiGo</h1>
        <p class="subtitle">每日词组 · 双向记忆 · 曲线复习</p>
      </header>

      <div class="home-stats">
        <div class="stat-chip"><span id="stat-total">–</span><label>词库</label></div>
        <div class="stat-chip"><span id="stat-learned">–</span><label>已学</label></div>
        <div class="stat-chip"><span id="stat-streak">–</span><label>连续打卡</label></div>
      </div>

      <div class="task-cards">
        <div class="task-card task-new">
          <div class="task-num" id="num-new">–</div>
          <div class="task-label">待学新词</div>
          <div class="task-hint">中文 → 英文 → 错词循环</div>
        </div>
        <div class="task-card task-review">
          <div class="task-num" id="num-review">–</div>
          <div class="task-label">到期复习</div>
          <div class="task-hint">记忆曲线 · 双向测试</div>
        </div>
      </div>

      <button id="btn-start" class="btn-primary">开始学习</button>
      <p id="home-note" class="home-note"></p>

      <div class="batch-progress" id="batch-progress"></div>
    </section>

    <!-- 词库管理 -->
    <section id="view-library" class="view hidden">
      <h2 class="view-title">词库管理</h2>
      <div class="toolbar">
        <input id="lib-search" class="lib-input" placeholder="搜索英文 / 中文 / 备注" />
        <select id="lib-batch" class="lib-select" aria-label="按批次筛选">
          <option value="">全部批次</option>
        </select>
        <button id="btn-rename-batch" class="btn-small" disabled>重命名批次</button>
        <select id="lib-sort" class="lib-select" aria-label="词库排序">
          <option value="added">录入顺序</option>
          <option value="en">英文 A–Z</option>
          <option value="type">按类型排序</option>
        </select>
        <select id="lib-tag" class="lib-select">
          <option value="">全部标签</option>
        </select>
        <select id="lib-type" class="lib-select">
          <option value="">全部类型</option>
          <option value="word">单词</option>
          <option value="phrase">词组</option>
          <option value="sentence">句型</option>
        </select>
        <select id="lib-state" class="lib-select">
          <option value="">全部状态</option>
          <option value="new">未学</option>
          <option value="learning">学习中</option>
          <option value="review">复习中</option>
          <option value="mastered">已掌握</option>
          <option value="suspended">已搁置</option>
        </select>
        <button id="btn-add" class="btn-small">+ 加词</button>
        <button id="btn-export-csv" class="btn-small">导出 CSV</button>
        <button id="btn-export-db" class="btn-small">备份数据库</button>
      </div>

      <div class="table-wrap">
        <table class="phrase-table">
          <thead>
            <tr>
              <th>类型</th><th>英文</th><th>中文</th><th>批次</th><th>标签</th>
              <th>状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="lib-tbody"></tbody>
        </table>
      </div>

      <div class="pager">
        <button id="page-prev" class="btn-small">上一页</button>
        <span id="page-info">1 / 1</span>
        <button id="page-next" class="btn-small">下一页</button>
      </div>
    </section>

    <!-- 统计仪表盘 -->
    <section id="view-dashboard" class="view hidden">
      <h2 class="view-title">学习统计</h2>
      <div class="dash-cards">
        <div class="dash-card"><span id="d-total">0</span><label>词库总数</label></div>
        <div class="dash-card"><span id="d-learned">0</span><label>已学</label></div>
        <div class="dash-card"><span id="d-mastered">0</span><label>已掌握</label></div>
        <div class="dash-card"><span id="d-forget">0%</span><label>遗忘率</label></div>
        <div class="dash-card"><span id="d-streak">0</span><label>连续打卡</label></div>
        <div class="dash-card"><span id="d-ratings">0</span><label>累计评级</label></div>
      </div>

      <h3 class="panel-title">近 30 天学习</h3>
      <div class="chart" id="chart-bars"></div>
      <div class="chart-legend">
        <span><i class="legend-dot legend-new"></i>新学</span>
        <span><i class="legend-dot legend-review"></i>复习</span>
        <span><i class="legend-dot legend-lapse"></i>遗忘</span>
      </div>

      <h3 class="panel-title">近 90 天活动热力图</h3>
      <div class="heatmap" id="heatmap"></div>

      <h3 class="panel-title">未来 7 天到期</h3>
      <div class="due-week" id="due-week"></div>
    </section>

    <!-- 突击模式 -->
    <section id="view-cram" class="view hidden">
      <h2 class="view-title">考前突击</h2>
      <p class="cram-desc">
        优先抽取遗忘次数多、难度系数低、到期早的词，双向测试，评分照常更新排期。
      </p>
      <div class="cram-setup">
        <label for="cram-limit">抽取数量</label>
        <input id="cram-limit" type="number" value="30" min="1" max="200" />
        <button id="btn-cram-start" class="btn-primary">开始突击</button>
      </div>
      <p id="cram-warn" class="home-note"></p>
    </section>

    <!-- 学习页（常规 / 突击共用） -->
    <section id="view-study" class="view hidden">
      <div class="study-top">
        <button id="btn-exit-study" class="exit-btn" title="保存进度并返回首页" aria-label="保存进度并返回首页">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="stage-label" id="stage-label">新词 · 中译英</div>
        <div class="stage-count" id="stage-count">本轮剩余 0</div>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar"><div id="progress-fill"></div></div>
      </div>

      <div class="flashcard" id="flashcard">
        <div class="card-badges">
          <span class="badge badge-type" id="badge-type">词组</span>
          <span class="badge badge-tag hidden" id="badge-tag"></span>
          <span class="badge badge-dir" id="badge-dir">中译英</span>
        </div>

        <!-- 正面 -->
        <div class="card-face" id="card-front">
          <div class="face-hint" id="front-hint">看中文，回忆英文</div>
          <div class="face-text" id="front-text"></div>
          <div class="face-phonetic hidden" id="front-phonetic"></div>
        </div>

        <!-- 背面（翻面后显示，只显示答案侧） -->
        <div class="card-back hidden" id="card-back">
          <div class="back-line" id="back-line-en">
            <span class="back-text" id="back-en"></span>
            <span class="back-phonetic" id="back-phonetic"></span>
          </div>
          <div class="back-line" id="back-line-zh">
            <span class="back-text" id="back-zh"></span>
          </div>
          <div class="back-pos hidden" id="back-pos"></div>
          <div class="back-note hidden" id="back-note"></div>
        </div>

        <div class="card-flip-hint" id="flip-hint">按 空格 翻面</div>
      </div>

      <div class="rate-row hidden" id="rate-row">
        <button class="rate-btn rate-again" data-rating="1">
          <span class="rate-key">1</span><span class="rate-name">不会</span>
        </button>
        <button class="rate-btn rate-hard" data-rating="2">
          <span class="rate-key">2</span><span class="rate-name">模糊</span>
        </button>
        <button class="rate-btn rate-good" data-rating="3">
          <span class="rate-key">3</span><span class="rate-name">记住</span>
        </button>
        <button class="rate-btn rate-easy" data-rating="4">
          <span class="rate-key">4</span><span class="rate-name">掌握</span>
        </button>
      </div>
    </section>

    <!-- 结束页 -->
    <section id="view-finish" class="view hidden">
      <div class="finish-hero">
        <h2 id="finish-title">今日任务完成</h2>
        <p>辛苦了，记忆已更新</p>
      </div>

      <div class="finish-grid">
        <div class="finish-item"><span id="f-new">0</span><label>新学词组</label></div>
        <div class="finish-item"><span id="f-review">0</span><label>复习词组</label></div>
        <div class="finish-item"><span id="f-lapse">0</span><label>遗忘重做</label></div>
        <div class="finish-item"><span id="f-time">0</span><label>用时（分钟）</label></div>
        <div class="finish-item"><span id="f-streak">0</span><label>连续打卡</label></div>
        <div class="finish-item"><span id="f-tomorrow">0</span><label>明日到期</label></div>
      </div>

      <button id="btn-home" class="btn-primary">返回首页</button>
    </section>

  </main>

  <!-- 加词 / 编辑弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h3 id="modal-title">加词</h3>
      <div class="form-row">
        <label>类型</label>
        <select id="f-type">
          <option value="phrase">词组</option>
          <option value="word">单词</option>
          <option value="sentence">句型</option>
        </select>
      </div>
      <div class="form-row">
        <label>批次</label>
        <select id="f-batch">
          <option value="">（沿用最近批次）</option>
        </select>
      </div>
      <div id="new-batch-row" class="form-row hidden">
        <label>新批次名称</label><input id="f-batch-name" maxlength="100" placeholder="如 高频动词搭配" />
      </div>
      <div class="form-row"><label>英文</label><input id="f-en" /></div>
      <div class="form-row"><label>中文</label><input id="f-zh" /></div>
      <div class="form-row word-only"><label>音标</label><input id="f-phonetic" placeholder="如 /əˈbrɔːd/" /></div>
      <div class="form-row word-only"><label>词性</label><input id="f-pos" placeholder="如 n. / v." /></div>
      <div class="form-row">
        <label>标签</label>
        <input id="f-tag" list="tag-list" placeholder="如 AI工具" />
        <datalist id="tag-list"></datalist>
      </div>
      <div class="form-row"><label>备注</label><textarea id="f-note" rows="2"></textarea></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-small">取消</button>
        <button id="modal-save" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <script src="{{ static_v('app.js') }}"></script>
</body>
</html>
